<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Monograma</title>
<link rel="stylesheet" href="marca.css">
<style>
  html, body { width: 1080px; height: 1080px; overflow: hidden; }
  body { display: grid; place-items: center; }
  body.fondo-judogi { background: var(--judogi); }
  body.fondo-transparente { background: transparent; }
  .mono { font-size: 760px; }
</style>
</head>
<body>
<!-- El fondo se elige en la URL: monograma.html?fondo=tatami | judogi | transparente -->
<div class="mono"></div>
<script>
  const fondo = new URLSearchParams(location.search).get("fondo") || "tatami";
  document.body.classList.add(fondo === "tatami" ? "tatami" : `fondo-${fondo}`);
</script>
<script src="marca.js"></script>
</body>
</html>
