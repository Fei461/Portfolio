<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Banner de LinkedIn</title>
<link rel="stylesheet" href="marca.css">
<style>
  html, body { width: 1584px; height: 396px; overflow: hidden; }

  /* Como la portada del portfolio: el nombre gigante, recortado por los bordes,
     y el cinturón cruzando en diagonal. */
  .banner {
    position: relative;
    width: 1584px;
    height: 396px;
    overflow: hidden;
    background-size: 520px 520px;
    background-position: -60px -150px;
  }

  /* LinkedIn tapa la esquina inferior izquierda con la foto de perfil:
     todo lo que importa empieza a partir de x = 430. */
  .banner__nombre {
    position: absolute;
    left: 424px;
    bottom: 22px;
    margin: 0;
    font-size: 330px;
    line-height: 0.8;
    white-space: nowrap;
  }

  .banner__nombre span {
    display: inline-block;
  }

  /* Las letras inquietas, como cuando pasas el ratón por la portada */
  .salta-1 { transform: translateY(-0.05em) rotate(-5deg); }
  .salta-2 { transform: translateY(-0.06em) rotate(6deg); }
  .salta-3 { transform: translateY(-0.03em) rotate(-4deg); }

  .banner__tarjeta {
    position: absolute;
    left: 452px;
    top: 18px;
    max-width: 600px;
    padding: 10px 16px 12px;
    background: var(--judogi);
    border: 3px solid var(--sumi);
    border-left: 12px solid var(--obi);
    box-shadow: 6px 6px 0 var(--heri);
    rotate: -1.2deg;
  }

  .banner__lema {
    margin: 0;
    font-weight: 800;
    font-variation-settings: "opsz" 40, "wdth" 82;
    font-size: 34px;
    line-height: 1;
  }

  .banner__frase {
    margin: 6px 0 0;
    font-weight: 500;
    font-size: 18px;
    line-height: 1.35;
  }

  /* El cinturón cruza la esquina, con la web bordada */
  .banner__obi {
    position: absolute;
    right: -150px;
    top: 58px;
    width: 720px;
    height: 58px;
    rotate: 24deg;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-variation-settings: "opsz" 24, "wdth" 88;
    font-size: 24px;
    box-shadow: 4px 5px 0 var(--heri);
  }
</style>
</head>
<body>
<main class="banner tatami">
  <div class="banner__obi obi">fei461.github.io/Portfolio</div>
  <h1 class="titular banner__nombre" aria-label="Lara Feijóo"><span>L</span><span>a</span><span class="salta-1">r</span><span>a</span> <span>F</span><span class="salta-2">e</span><span>i</span><span>j</span><span class="salta-3">ó</span><span>o</span></h1>
  <div class="banner__tarjeta">
    <p class="banner__lema">Publicista con culo inquieto.</p>
    <p class="banner__frase">Lo primero que aprendes en judo es a caer.<br>Lo segundo, a levantarte con otra idea.</p>
  </div>
</main>
<script src="marca.js"></script>
</body>
</html>
